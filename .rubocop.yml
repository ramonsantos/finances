plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  Exclude:
    - bin/*
    - config.ru
    - config/importmap.rb
    - config/initializers/pagy.rb
    - db/migrate/20260222162255_add_service_name_to_active_storage_blobs.active_storage.rb
    - db/migrate/20260222162256_create_active_storage_variant_records.active_storage.rb
    - db/migrate/20260222162257_remove_not_null_on_active_storage_blobs_checksum.active_storage.rb
    - db/cable_schema.rb
    - db/cache_schema.rb
    - db/queue_schema.rb
    - db/schema.rb
    - Rakefile
  TargetRubyVersion: 4.0
  SuggestExtensions: false

Layout/EmptyLines:
  Exclude:
    - config/ci.rb

Layout/HashAlignment:
  Enabled: true
  AllowMultipleStyles: true
  EnforcedHashRocketStyle:
    - key
    - table
  EnforcedColonStyle:
    - key
    - table

Layout/LineLength:
  Enabled: false

Layout/SpaceInsideArrayLiteralBrackets:
  Exclude:
    - config/environments/production.rb

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Style/ArgumentsForwarding:
  Enabled: false

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - config/application.rb

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - config/application.rb
    - config/boot.rb
    - config/ci.rb
    - config/environment.rb
    - config/environments/*
    - config/initializers/assets.rb
    - config/initializers/content_security_policy.rb
    - config/initializers/filter_parameter_logging.rb
    - config/initializers/inflections.rb
    - config/puma.rb

Style/GlobalStdStream:
  Exclude:
    - config/environments/production.rb

Style/MethodCallWithArgsParentheses:
  Enabled: true
  Exclude:
    - config/routes.rb
    - config/application.rb
  IncludedMacros:
    - post
    - get
    - put
    - patch
    - delete
  AllowedMethods:
    - prepend
    - include
    - to
    - not_to
    - describe

Style/NumericLiterals:
  Enabled: false

Style/StringLiterals:
  Exclude:
    - config/application.rb
    - config/boot.rb
    - config/ci.rb
    - config/environment.rb
    - config/environments/*
    - config/initializers/assets.rb
    - config/puma.rb

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets
  Exclude:
    - app/validators/brazilian_phone_validator.rb
    - config/application.rb

# RSpec
RSpec/ContextWording:
  Exclude:
  - spec/support/shared_context/*
  Prefixes:
    - associations
    - validations
    - when
    - with
    - without

RSpec/ExampleLength:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

# RSpecRails
RSpecRails/InferredSpecType:
  Enabled: false

# ThreadSafety
ThreadSafety/DirChdir:
  Exclude:
    - bin/setup